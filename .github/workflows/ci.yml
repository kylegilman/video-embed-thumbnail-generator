name: CI

on:
  push:
    branches: [main, 5.0]
  pull_request:

jobs:
  lint-and-static-analysis:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs -n

      - name: PHPStan
        run: composer analyze

  test:
    name: PHPUnit + Playwright E2E
    runs-on: ubuntu-latest
    steps:
      # Sibling checkouts mirror the local dev layout (see .wp-env.json's
      # "plugins" list and tests/README.md) — video-embed-thumbnail-generator,
      # videopack-player-pro, and videopack-cloud-streaming as sibling
      # directories under the same parent.
      - name: Checkout video-embed-thumbnail-generator
        uses: actions/checkout@v4
        with:
          path: video-embed-thumbnail-generator

      - name: Checkout videopack-player-pro
        uses: actions/checkout@v4
        with:
          repository: kylegilman/videopack-player-pro
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: videopack-player-pro

      - name: Checkout videopack-cloud-streaming
        uses: actions/checkout@v4
        with:
          repository: kylegilman/videopack-cloud-streaming
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: videopack-cloud-streaming

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-embed-thumbnail-generator/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        working-directory: video-embed-thumbnail-generator
        run: composer install --no-progress --prefer-dist

      - name: Install JS dependencies
        working-directory: video-embed-thumbnail-generator
        run: npm ci

      - name: Start wp-env
        working-directory: video-embed-thumbnail-generator
        run: npx wp-env start

      - name: Run PHPUnit (core suite)
        working-directory: video-embed-thumbnail-generator
        run: npm run pretest:php && npm run test:php

      - name: Run PHPUnit (Pro integration suite)
        working-directory: video-embed-thumbnail-generator
        run: npx wp-env run cli wp-content/plugins/video-embed-thumbnail-generator/vendor/bin/phpunit --configuration=wp-content/plugins/video-embed-thumbnail-generator/phpunit-pro.xml

      - name: Install Playwright browsers
        working-directory: video-embed-thumbnail-generator
        run: npx playwright install --with-deps chromium

      - name: Seed E2E fixtures
        working-directory: video-embed-thumbnail-generator
        run: npm run e2e:seed

      - name: Run Playwright E2E
        working-directory: video-embed-thumbnail-generator
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: video-embed-thumbnail-generator/playwright-report/
          retention-days: 14

      - name: Dump wp-env logs on failure
        if: failure()
        working-directory: video-embed-thumbnail-generator
        run: npx wp-env logs --watch=false || true
