name: CI

on:
  push:
    branches: [main, 5.0]
  pull_request:

jobs:
  lint-and-static-analysis:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs -n

      - name: PHPStan
        run: composer analyze

  test:
    name: PHPUnit + Playwright E2E
    runs-on: ubuntu-latest
    steps:
      # Sibling checkouts mirror the local dev layout (see .wp-env.json's
      # "plugins" list and tests/README.md) — video-embed-thumbnail-generator,
      # videopack-player-pro, and videopack-cloud-streaming as sibling
      # directories under the same parent.
      - name: Checkout video-embed-thumbnail-generator
        uses: actions/checkout@v4
        with:
          path: video-embed-thumbnail-generator

      - name: Checkout videopack-player-pro
        uses: actions/checkout@v4
        with:
          repository: kylegilman/videopack-player-pro
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: videopack-player-pro

      - name: Checkout videopack-cloud-streaming
        uses: actions/checkout@v4
        with:
          repository: kylegilman/videopack-cloud-streaming
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: videopack-cloud-streaming

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: video-embed-thumbnail-generator/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none

      - name: Install PHP dependencies
        working-directory: video-embed-thumbnail-generator
        run: composer install --no-progress --prefer-dist

      - name: Install JS dependencies
        working-directory: video-embed-thumbnail-generator
        run: npm ci

      # .wp-env.override.json is gitignored -- without at least
      # VIDEOPACK_FORCE_PREMIUM_FOR_TESTING set, no premium-gated code (e.g.
      # player-pro's Video.js v10 player) ever activates on a fresh checkout,
      # and videojs-v10-standalone.spec.js would silently test against
      # whatever the free-tier fallback renders instead of the real thing.
      # This value alone isn't a secret (it's just a boolean flag), so it's
      # safe to write directly here -- the actual license-bypass logic it
      # triggers lives in videopack-player-pro's tests/mu-plugins/
      # force-premium.php (private repo), mounted via this repo's
      # .wp-env.json, not committed anywhere in this (public) repo.
      - name: Create wp-env override for premium testing
        working-directory: video-embed-thumbnail-generator
        run: |
          cat > .wp-env.override.json <<'EOF'
          {
            "config": {
              "VIDEOPACK_FORCE_PREMIUM_FOR_TESTING": true
            }
          }
          EOF

      - name: Start wp-env
        working-directory: video-embed-thumbnail-generator
        run: npx wp-env start

      - name: Run PHPUnit (core suite)
        working-directory: video-embed-thumbnail-generator
        run: npm run pretest:php && npm run test:php

      - name: Install Playwright browsers
        working-directory: video-embed-thumbnail-generator
        run: npx playwright install --with-deps chromium

      - name: Seed E2E fixtures
        working-directory: video-embed-thumbnail-generator
        run: npm run e2e:seed

      - name: Run Playwright E2E
        working-directory: video-embed-thumbnail-generator
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: video-embed-thumbnail-generator/playwright-report/
          retention-days: 14

      - name: Dump wp-env logs on failure
        if: failure()
        working-directory: video-embed-thumbnail-generator
        run: npx wp-env logs --watch=false || true
